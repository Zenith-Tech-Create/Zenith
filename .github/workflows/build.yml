name: 🏗️ Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
            arch: arm64
          - os: macos-latest
            target: mac
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-latest
            target: linux
            arch: x64

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm install

      - name: 🔍 Verify appx icons (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          echo "=== build/appx contents ==="
          dir build\appx
          echo "=== assets contents ==="
          dir assets
        shell: cmd

      - name: 🧹 Clear electron-builder cache (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          if exist "%LOCALAPPDATA%\electron-builder" rmdir /s /q "%LOCALAPPDATA%\electron-builder"
          echo "Cache cleared"
        shell: cmd

      - name: 🔑 Inject API key
        run: node scripts/inject-env.js
        env:
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}

      - name: 🏗️ Build app (${{ matrix.target }} - ${{ matrix.arch }})
        run: npm run build:${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_PUBLISH: never

      - name: 📦 Build appx (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
          npm run build:appx
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_PUBLISH: never

      - name: 📋 List dist output (Windows only)
        if: matrix.os == 'windows-latest'
        run: dir dist
        shell: cmd

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.arch }}
          path: dist/
          retention-days: 30

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-combined/
          merge-multiple: true

      - name: 📋 List all artifacts
        run: ls -la dist-combined/

      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist-combined/*.dmg
            dist-combined/*.zip
            dist-combined/*.exe
            dist-combined/*.appx
            dist-combined/*.AppImage
            dist-combined/*.deb
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}